<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Phone Body -->
  <rect x="136" y="80" width="240" height="352" rx="44" fill="url(#phoneGrad)" stroke="#334155" stroke-width="8"/>
  <rect x="156" y="104" width="200" height="304" rx="28" fill="#020617" stroke="#1e293b" stroke-width="4"/>

  <!-- Top Speaker notch -->
  <rect x="220" y="92" width="72" height="8" rx="4" fill="#475569"/>

  <!-- Glowing Checkmark Circle in Phone Screen -->
  <circle cx="256" cy="240" r="64" fill="#064e3b" stroke="url(#glowGrad)" stroke-width="8" filter="url(#glow)"/>
  
  <!-- Checkmark -->
  <path d="M228 240 L248 260 L288 216" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom Home bar -->
  <rect x="216" y="386" width="80" height="6" rx="3" fill="#64748b"/>

  <!-- Tech Sparkles / Pulse waves -->
  <path d="M104 220 C104 200, 114 180, 130 170" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
  <path d="M408 220 C408 200, 398 180, 382 170" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
  <path d="M90 240 C90 210, 105 170, 126 150" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-opacity="0.5"/>
  <path d="M422 240 C422 210, 407 170, 386 150" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-opacity="0.5"/>

  <polygon points="380,100 390,120 410,130 390,140 380,160 370,140 350,130 370,120" fill="#34d399"/>
  <polygon points="120,340 126,352 138,358 126,364 120,376 114,364 102,358 114,352" fill="#10b981"/>
</svg>
